name: CI

on:
  pull_request:
    branches:
      - main
      - develop # Change this to your default branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v3
        - name: Set up Node
          uses: actions/setup-node@v2
          with:
            node-version: '14'
        - name: Install dependencies
          run: npm install
        - name: Run tests
          run: npm test

        - name: Run tests
          run: npm run test